name: Evolve Trading Strategy

on:
  schedule:
    # Runs every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows you to trigger it manually from the "Actions" tab

jobs:
  evolve:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Using stable 3.12 for cloud compatibility
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Strategy Evolution
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
        run: python main.py

      - name: Commit and Push Evolved Strategy
        run: |
          git config --global user.name "AI Strategy Lab Bot"
          git config --global user.email "bot@ai-strategy-lab.local"
          git add strategies/active/*.json strategies/archive/*.json
          git commit -m "AI Evolution: Updated strategy version [skip ci]" || echo "No changes to commit"
          git push
